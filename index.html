<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f4" />
    <meta name="description" content="A simple baby feeding time tracker." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>FeedTime</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <defs>
              <radialGradient id="brand-skin" cx="17" cy="15" r="31" gradientUnits="userSpaceOnUse">
                <stop stop-color="#fffdf9" />
                <stop offset=".72" stop-color="#fff4ea" />
                <stop offset="1" stop-color="#f7d9d0" />
              </radialGradient>
              <radialGradient id="brand-areola" cx="21" cy="20" r="9" gradientUnits="userSpaceOnUse">
                <stop stop-color="#f7c2b9" />
                <stop offset="1" stop-color="#e99591" />
              </linearGradient>
            </defs>
            <circle cx="24" cy="24" r="19" fill="#d96f71" opacity=".22" />
            <circle cx="24" cy="23" r="18" fill="url(#brand-skin)" />
            <circle cx="24" cy="23" r="8.3" fill="url(#brand-areola)" />
            <circle cx="24" cy="23" r="3.1" fill="#dc8583" />
            <ellipse cx="22.8" cy="21.9" rx="1.15" ry=".7" fill="#fff8f4" opacity=".9" />
            <path d="M11.8 20.5c.9-5.6 5.3-10 10.8-11" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".8" stroke-width="1.3" />
            <path d="M29.5 36.2c2.5-1 4.5-2.8 5.8-5.1" fill="none" stroke="#e8b8ae" stroke-linecap="round" stroke-opacity=".75" stroke-width="1.2" />
          </svg>
        </div>
        <div>
          <p class="eyebrow">Baby feeding tracker</p>
          <h1>FeedTime</h1>
        </div>
        <button class="install-button" id="install-button" type="button" hidden>Install app</button>
      </header>

      <section class="tracker-card" aria-labelledby="tracker-title">
        <div class="intro">
          <p class="eyebrow">Today’s feeding</p>
          <h2 id="tracker-title">What breast are you feeding?</h2>
          <p>Tap a breast to start or finish a feeding.</p>
        </div>

        <div class="breast-grid" aria-label="Breast feeding controls">
          <button class="breast-button breast-left" type="button" data-breast="L" aria-pressed="false">
            <span class="button-label">L</span>
            <span class="button-copy">Left breast</span>
            <span class="button-status">Tap to start</span>
          </button>

          <button class="breast-button breast-right" type="button" data-breast="R" aria-pressed="false">
            <span class="button-label">R</span>
            <span class="button-copy">Right breast</span>
            <span class="button-status">Tap to start</span>
          </button>
        </div>

        <div class="last-feed-card" aria-label="Time since last feed">
          <span class="last-feed-icon" aria-hidden="true">◷</span>
          <div>
            <p class="last-feed-label">Since the last feed</p>
            <p class="last-feed-time" id="last-feed-time" aria-live="polite">Waiting for feeding log…</p>
          </div>
        </div>

        <div class="hint" aria-hidden="true">
          <span class="hint-dot"></span>
          Green means feeding is in progress
        </div>

        <div class="bathroom-actions" aria-label="Bathroom activity controls">
          <button class="bathroom-button" type="button" data-activity="pee">
            <svg class="bathroom-icon pee-icon" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 3C12.8 7.7 7 14 7 20a9 9 0 0 0 18 0c0-6-5.8-12.3-9-17Z" />
              <path class="pee-highlight" d="M12.2 18.1c.3-2.1 1.4-4.3 2.7-6.2" />
            </svg>
            <span>Pee</span>
          </button>
          <button class="bathroom-button" type="button" data-activity="poop">
            <span aria-hidden="true">💩</span>
            <span>Poop</span>
          </button>
        </div>
      </section>

      <section class="log-card" aria-labelledby="log-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Recent activity</p>
            <h2 id="log-title">Feeding log</h2>
          </div>
        </div>

        <div class="log-list" id="log-list" aria-live="polite">
          <div class="empty-state">
            <span class="empty-icon" aria-hidden="true">✦</span>
            <p>Your feeding entries will appear here.</p>
          </div>
        </div>
        <button class="load-older-button" id="load-older" type="button" hidden>Load older entries</button>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="assertive" aria-atomic="true"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
